    string model_message = 2;

    enum RecoverableErrorType {
      RECOVERABLE_ERROR_TYPE_UNSPECIFIED = 0;
      RECOVERABLE_ERROR_TYPE_SEARCH_STRING_NOT_FOUND = 1;
      RECOVERABLE_ERROR_TYPE_AMBIGUOUS_SEARCH_STRING = 2;
