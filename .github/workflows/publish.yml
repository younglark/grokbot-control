# Publish grokbot-control to https://registry.npmjs.org via npm Trusted Publishing (OIDC).
#
# Trigger: push of a version tag (v*) only. GitHub Releases do not trigger
# publishing, so creating a Release from an already-pushed tag will not
# publish twice.
#
# One-time prerequisite (npmjs.com -> grokbot-control -> Settings ->
# Trusted Publisher -> GitHub Actions):
#   Organization or user: younglark
#   Repository:           grokbot-control
#   Workflow filename:    publish.yml
# No npm token or repository secret is needed. Trusted Publishing requires
# npm CLI >= 11.5.1 and Node >= 22.14.0.
#
# Release flow (after the first manual publish and Trusted Publisher setup):
#   npm version patch   # or minor/major; updates package.json and creates vX.Y.Z tag
#   git push origin main --follow-tags

name: Publish npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # Required for npm Trusted Publishing (OIDC)

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish
        run: npm publish --access public
